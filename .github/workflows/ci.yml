name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
          - name: Ubuntu read-only CLI
            os: ubuntu-24.04
          - name: macOS read-only CLI
            os: macos-15
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify runtime version
        run: pnpm exec node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(process.versions.node, fs.readFileSync('.node-version', 'utf8').trim()); console.log(process.version);"
      - name: Typecheck
        run: pnpm run typecheck
      - name: Runtime tests and compilation
        if: runner.os == 'Windows'
        run: pnpm test
      - name: Compile CLI
        if: runner.os != 'Windows'
        run: pnpm run build
      - name: Read-only CLI and planning tests
        if: runner.os != 'Windows'
        run: pnpm exec node --test tests/runtime/cli.test.mjs tests/runtime/planning.test.mjs
      - name: Finite state models
        if: runner.os == 'Windows'
        run: pnpm run verify:model
      - name: Build artificial sites
        if: runner.os == 'Windows'
        run: pnpm run verify:sites
