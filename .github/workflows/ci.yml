name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cli:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-2025
          - name: Ubuntu CLI
            os: ubuntu-24.04
          - name: macOS CLI
            os: macos-15
            filesystem: APFS
          - name: macOS case-sensitive CLI
            os: macos-15
            filesystem: APFSX
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Mount local APFS test volume
        if: runner.os == 'macOS'
        shell: bash
        run: |
          hdiutil create -size 3g -type SPARSE -fs "${{ matrix.filesystem }}" -volname CorkoroTests "$RUNNER_TEMP/corkoro.sparseimage"
          hdiutil attach -nobrowse "$RUNNER_TEMP/corkoro.sparseimage"
          mkdir /Volumes/CorkoroTests/tmp
          echo 'TMPDIR=/Volumes/CorkoroTests/tmp' >> "$GITHUB_ENV"
          diskutil info /Volumes/CorkoroTests
      - name: Identify Linux test filesystem
        if: runner.os == 'Linux'
        run: findmnt -T /tmp
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@7088e561eb65bb68695d245aa206f005ef30921d # v4.1.0
        with:
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Verify runtime version
        run: pnpm exec node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; assert.equal(process.versions.node, fs.readFileSync('.node-version', 'utf8').trim()); console.log(process.version);"
      - name: Typecheck
        run: pnpm run typecheck
      - name: Runtime tests and compilation
        run: pnpm test
      - name: Finite state models
        run: pnpm run verify:model
      - name: Build artificial sites
        run: pnpm run verify:sites
